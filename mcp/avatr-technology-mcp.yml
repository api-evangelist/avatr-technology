name: Avatr Hong Kong site MCP server
summary: The AVATR Hong Kong site (www.avatr.hk) is built on Wix and exposes the Wix Site MCP endpoint
  at https://www.avatr.hk/_api/mcp. It answers an anonymous JSON-RPC tools/list with 9 tools. This is
  a PLATFORM-PROVIDED surface that Wix turns on for the site, not an AVATR product or vehicle API — it
  reads and acts on the public marketing site only. AVATR's own corporate domain (www.avatr.com) publishes
  no MCP server, no OpenAPI, and no developer program.
server:
  url: https://www.avatr.hk/_api/mcp
  transport: streamable-http
  protocol: json-rpc-2.0
  platform: Wix Site MCP
  platform_docs: https://dev.wix.com/docs/develop-websites/articles/get-started/about-the-wix-site-mcp
  first_party: false
  first_party_note: Served from an AVATR-controlled hostname (www.avatr.hk, the official Hong Kong site
    linked from the www.avatr.com footer), but the tool surface is generated by the Wix platform and is
    identical across Wix-hosted sites. It is not authored by AVATR Technology (Chongqing) Co., Ltd.
  authentication:
    required: false
    note: tools/list answered anonymously (HTTP 200). Acting on the visitor's behalf requires a visitor
      token minted by the GenerateVisitorToken tool; there is no OAuth authorization-server or protected-resource
      metadata — both /.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource
      return HTTP 400 on this host.
