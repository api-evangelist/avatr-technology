tools:
- name: GetBusinessDetails
  category: site
  description: Business and site details for the AVATR HK site — timezone, email, phone, address.
  parameters: []
- name: SearchInSite
  category: site
  description: Full-text search across the public AVATR HK site content.
  parameters:
  - searchTerm
- name: SearchSiteApiDocs
  category: docs
  description: Returns the API documentation for the Wix business solutions installed on this site.
  parameters:
  - searchTerm
- name: GenerateVisitorToken
  category: auth
  description: Creates a visitor session and returns a visitor access token; prerequisite for CallWixSiteAPI.
  parameters: []
- name: CallWixSiteAPI
  category: action
  description: Calls a Wix REST API method on the site on a visitor's behalf.
  parameters:
  - visitorToken
  - url
  - method
  - body
- name: ExecuteWixAPI
  category: action
  description: Runs JavaScript against the Wix REST API on the site.
  parameters:
  - code
  - reason
  - hasMutations
  - sourceDocUrls
  - visitorToken
- name: BrowseWixRESTDocsMenu
  category: docs
  description: Browses the Wix REST API documentation menu hierarchy.
  parameters:
  - menuUrl
  - reason
- name: ReadFullDocsArticle
  category: docs
  description: Fetches a full article from the Wix developer documentation portal.
  parameters:
  - articleUrl
- name: ReadFullDocsMethodSchema
  category: docs
  description: Fetches the full request/response schema for a Wix API method.
  parameters:
  - articleUrl
  - reason
observations:
- 6 of the 9 tools (ReadFullDocsArticle, ReadFullDocsMethodSchema, BrowseWixRESTDocsMenu, SearchSiteApiDocs,
  CallWixSiteAPI, ExecuteWixAPI) are Wix-platform documentation and execution tools, not AVATR-domain
  capabilities. Only GetBusinessDetails and SearchInSite return AVATR content.
- Several tool descriptions embed <agent-mandatory-instructions> blocks written by the Wix platform that
  instruct a connecting agent how to behave. Recorded here as observed; the verbatim bodies are in mcp/avatr-technology-hk-mcp-tools.json.
- 'No ToolCrosswalk is emitted: there is no AVATR OpenAPI to bind these tools to, and the operations they
  reach are Wix''s, not AVATR''s.'
