aid: avatr-technology
name: Avatr Technology
description: >-
  AVATR Technology (Chongqing) Co., Ltd. (阿维塔科技) is a Chinese premium intelligent
  electric-vehicle manufacturer headquartered in Chongqing, founded in 2018 as a
  joint venture in which Changan Automobile and CATL are the two largest
  shareholders and Huawei supplies the smart-cockpit and advanced driver-assistance
  stack. Its vehicles — the AVATR 11 and 12, the volume 06 and 07 (battery-electric
  and range-extended), and the limited 011 and 012 — are built on the jointly
  developed CHN smart-EV platform, a six-layer architecture spanning the mechanical,
  energy, electronic/electrical architecture, vehicle operating system, vehicle
  function application and cloud big-data layers. AVATR produced 73,606 vehicles in
  2024 and sells through mainland China plus overseas markets including Hong Kong,
  Singapore, Thailand, Sri Lanka, the UAE and Qatar, with design and engineering
  offices in Shanghai and Munich. AVATR is a vehicle manufacturer, not a software
  vendor: www.avatr.com is a marketing and configurator site with no developer
  portal, no public API, no SDK and no machine-readable specification. The only
  live agent surface anywhere on an AVATR hostname is platform-provided — the
  official Hong Kong site runs on Wix and exposes the Wix Site MCP endpoint plus a
  Wix-generated llms.txt over its public marketing content.
